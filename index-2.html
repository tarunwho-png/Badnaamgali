<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Badnaam Gali — Tarunn K.</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#100b08;color:#f5dfae;font-family:Georgia,"Times New Roman",serif}
.hero{position:relative;width:100vw;height:100vh;min-height:560px;overflow:hidden;background:#100b08;display:flex;align-items:center;justify-content:center}
.hero img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.04),rgba(0,0,0,.08) 55%,rgba(0,0,0,.42))}
.topbar{position:absolute;top:22px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(245,223,174,.55);background:rgba(20,12,8,.66);backdrop-filter:blur(8px);border-radius:999px;letter-spacing:.08em;text-transform:uppercase;font-size:12px;white-space:nowrap}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e7bd69;margin-right:8px;box-shadow:0 0 12px #e7bd69}
.player{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(700px,calc(100% - 28px));display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid rgba(245,223,174,.45);background:rgba(20,12,8,.78);backdrop-filter:blur(10px);border-radius:16px}
.play{border:1px solid #e7bd69;background:#e7bd69;color:#1b100a;width:42px;height:42px;border-radius:50%;font-size:17px;cursor:pointer}
.track{min-width:0;flex:1}.track b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track small{opacity:.72}
.notice{position:absolute;right:18px;top:18px;padding:7px 10px;font-size:11px;background:rgba(0,0,0,.45);border:1px solid rgba(245,223,174,.3);border-radius:8px}
@media(max-width:700px){.hero{min-height:100svh;height:100svh}.hero img{object-fit:cover}.topbar{top:12px;font-size:10px}.player{bottom:14px}}
</style>
</head>
<body>
<main class="hero">
<img src="poster.jpg" alt="Badnaam Gali poster">
<div class="shade"></div>
<div class="topbar"><span class="dot"></span> Badnaam Gali · Mehfil</div>
<div class="notice">Tarunn K.</div>
<div class="player">
<button class="play" id="play">▶</button>
<div class="track"><b>Badnaam Gali — music player</b><small id="status">Add your MP3 as music.mp3 to enable playback.</small></div>
</div>
</main>
<audio id="audio" src="music.mp3" preload="metadata"></audio>
<script>
const a=document.getElementById('audio'),b=document.getElementById('play'),s=document.getElementById('status');
b.onclick=async()=>{try{if(a.paused){await a.play();b.textContent='Ⅱ';s.textContent='Playing';}else{a.pause();b.textContent='▶';s.textContent='Paused';}}catch(e){s.textContent='Add music.mp3 to this folder first.'}};
a.onended=()=>{b.textContent='▶';s.textContent='Finished'};
</script>
</body></html>
